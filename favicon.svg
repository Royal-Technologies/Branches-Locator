<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#157a3e" />
      <stop offset="100%" stop-color="#0b4d26" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b4d26" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pinGrad)" filter="url(#shadow)" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Network Connected Dots (Branch Network) -->
  <line x1="20" y1="20" x2="32" y2="28" stroke="rgba(255,213,74,0.4)" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="44" y1="20" x2="32" y2="28" stroke="rgba(255,213,74,0.4)" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="32" y1="28" x2="32" y2="48" stroke="rgba(255,213,74,0.4)" stroke-width="2" />
  
  <circle cx="20" cy="20" r="3" fill="#ffd54a" />
  <circle cx="44" cy="20" r="3" fill="#ffd54a" />

  <!-- Center Location Pin -->
  <path d="M32 14 C24.5 14 18.5 20 18.5 27.5 C18.5 37 32 49 32 49 C32 49 45.5 37 45.5 27.5 C45.5 20 39.5 14 32 14 Z" fill="url(#goldGrad)" filter="url(#shadow)" />
  
  <!-- Pin Center Dot -->
  <circle cx="32" cy="26" r="4.5" fill="#0b4d26" />
  <circle cx="32" cy="26" r="2" fill="#ffffff" />
</svg>
